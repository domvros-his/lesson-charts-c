<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Από την Ιστορική Γνώση στην Ιστορική Πράξη</title>
<style>
:root{
  --bg:#2b46b8;
  --surface:#fff8f1;
  --surface-soft:#e8ecff;
  --ink:#25233b;
  --muted:#6f6674;
  --line:#d8cfda;
  --accent:#365bd6;
  --accent-soft:#e5eaff;
  --warm:#861f45;
  --danger:#a52b4f;
  --gold:#f0bd4a;
  --burgundy:#861f45;
  --burgundy-soft:#f7e3ea;
  --royal-dark:#2948b9;
  --shadow:0 16px 38px rgba(28,26,72,.18);
  --radius:16px;
  --max:1280px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);
  background:
    radial-gradient(circle at 10% 8%, rgba(240,189,74,.28) 0 7%, transparent 24%),
    radial-gradient(circle at 88% 16%, rgba(183,64,101,.40) 0 10%, transparent 32%),
    radial-gradient(circle at 70% 88%, rgba(54,91,214,.34) 0 10%, transparent 32%),
    linear-gradient(135deg,#2445c2 0%,#4a3c99 46%,#7e2148 100%);
  background-attachment:fixed;
  font-family:"Segoe UI",Arial,sans-serif;line-height:1.55;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}

/* Header */
.app-header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(90deg,rgba(38,68,190,.96),rgba(84,48,132,.96) 54%,rgba(126,33,72,.96));
  color:#fff;border-bottom:1px solid rgba(255,255,255,.20);backdrop-filter:blur(12px);
  box-shadow:0 8px 24px rgba(25,22,67,.18);
}
.header-row{
  max-width:var(--max);margin:0 auto;padding:11px 22px;display:flex;
  align-items:center;gap:14px;min-height:68px;
}
.brand{min-width:0;display:flex;align-items:center;gap:11px;margin-right:auto}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--gold);display:grid;place-items:center;color:#4a2b46;font-weight:850;box-shadow:inset 0 -3px 0 rgba(89,48,24,.12)}
.brand-text{min-width:0}
.brand-title{font-weight:760;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:12px;color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main-nav{display:flex;align-items:center;gap:3px}
.nav-btn,.plain-btn,.unit-nav-btn,.icon-btn{
  border:0;background:transparent;border-radius:10px;padding:9px 11px;
  font-weight:650;font-size:13px;
}
.nav-btn:hover,.icon-btn:hover{background:rgba(255,255,255,.14)}
.plain-btn:hover,.unit-nav-btn:hover{background:var(--surface-soft)}
.nav-btn.active{background:#fff8f1;color:var(--royal-dark);box-shadow:0 3px 10px rgba(20,25,75,.14)}
.mobile-menu{display:none}

/* Main */
main{max-width:var(--max);margin:0 auto;padding:34px 22px 76px}
.view{animation:fade .16s ease}
@keyframes fade{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:none}}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:#ffd46e;font-weight:850;margin:0 0 8px;text-shadow:0 1px 0 rgba(0,0,0,.08)}
h1,h2,h3{line-height:1.18;margin-top:0}
h1{font-size:clamp(30px,4vw,50px);letter-spacing:-.035em;margin-bottom:12px}
h2{font-size:clamp(24px,3vw,34px);letter-spacing:-.02em}
h3{font-size:18px}
p{margin:0 0 12px}
.source-copy{max-width:930px;font-size:17px}
.source-flow{margin-top:22px;padding:16px 18px;border-left:4px solid var(--gold);background:rgba(255,248,241,.96);color:var(--ink);border-radius:0 12px 12px 0;font-weight:650;box-shadow:0 8px 24px rgba(34,28,76,.12)}

/* Home */
.home-hero{padding:30px 0 26px;border-bottom:1px solid rgba(255,255,255,.22)}
.home-hero>h1,.home-hero>.source-copy{color:#fff}
.home-hero>.source-copy{color:rgba(255,255,255,.90)}
.home-author{margin:4px 0 12px;color:rgba(255,255,255,.78);font-size:12.5px;line-height:1.45;font-weight:600}
.app-footer{max-width:var(--max);margin:0 auto 18px;padding:14px 22px 20px;border-top:1px solid rgba(255,255,255,.18);text-align:center;color:rgba(255,255,255,.68);font-size:11.5px;line-height:1.45}
.home-meta{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:var(--accent-soft);color:var(--royal-dark);font-size:12px;font-weight:700}
.home-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:28px}
.home-card{background:rgba(255,248,241,.97);border:1px solid rgba(255,255,255,.44);border-radius:14px;padding:18px;text-align:left;min-height:112px;transition:.15s ease;box-shadow:0 9px 24px rgba(32,28,74,.10)}
.home-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#aebbf0}
.home-card strong{display:block;font-size:17px;margin-bottom:5px}
.home-card span{font-size:13px;color:#6c6070}

/* Page heading */
.page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px;color:#fff}
.page-head p:not(.kicker){color:rgba(255,255,255,.88)}
.page-head .plain-btn{background:rgba(255,248,241,.96);color:var(--ink);border:1px solid rgba(255,255,255,.38)}
.page-head h1{margin-bottom:0}
.page-head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Roadmap */
.filter-bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.filter-bar select{border:1px solid rgba(255,255,255,.42);background:rgba(255,248,241,.97);border-radius:10px;padding:10px 12px;min-width:230px;box-shadow:0 5px 15px rgba(33,29,74,.08);font-weight:650}
.filter-bar select:first-child{border-color:rgba(54,91,214,.55);box-shadow:inset 0 0 0 1px rgba(54,91,214,.08),0 5px 15px rgba(33,29,74,.08)}
.filter-bar select:last-child{border-color:rgba(134,31,69,.50);box-shadow:inset 0 0 0 1px rgba(134,31,69,.07),0 5px 15px rgba(33,29,74,.08)}
.table-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#5e5368;background:#eee8f7;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr[data-unit]{cursor:pointer}
tbody tr[data-unit]:hover{background:#ecefff}

/* Roadmap — category colour system */
.roadmap-table-wrap{border-color:rgba(255,255,255,.42);box-shadow:0 16px 34px rgba(30,25,72,.16)}
.roadmap-table{min-width:1080px}
.roadmap-table th,.roadmap-table td{font-size:14.5px;line-height:1.5;padding:14px 15px;border-bottom-color:rgba(80,64,99,.13)}
.roadmap-table th{font-size:12.5px;font-weight:850;letter-spacing:.055em;color:#fff;border-right:1px solid rgba(255,255,255,.18);text-shadow:0 1px 0 rgba(0,0,0,.10)}
.roadmap-table th:nth-child(1){background:#365bd6}
.roadmap-table th:nth-child(2){background:#861f45}
.roadmap-table th:nth-child(3){background:#f0bd4a;color:#3f2e0a;text-shadow:none}
.roadmap-table th:nth-child(4){background:#147d79}
.roadmap-table th:nth-child(5){background:#6949b8}
.roadmap-table th:nth-child(6){background:#c94f62}
.roadmap-table td{font-weight:560;color:#29243a}
.roadmap-table td:nth-child(1){background:#e8edff;text-align:center;color:#2948b9;font-weight:850;font-size:16px}
.roadmap-table td:nth-child(2){background:#f8e8ee;font-weight:740;color:#64203b}
.roadmap-table td:nth-child(3){background:#fff3ce;text-align:center;font-weight:800;color:#6d4b04}
.roadmap-table td:nth-child(4){background:#e5f5f2;color:#225e5b}
.roadmap-table td:nth-child(5){background:#eee9fb;color:#523a8b;font-weight:680}
.roadmap-table td:nth-child(6){background:#fbe9ed;color:#8d3345;font-weight:680}
.roadmap-table tbody tr[data-unit]:hover td{filter:saturate(1.12) brightness(.985)}
.roadmap-table tbody tr[data-unit]:hover td:first-child{box-shadow:inset 4px 0 0 #365bd6}
.roadmap-table th:nth-child(1),.roadmap-table td:nth-child(1){width:68px}
.roadmap-table th:nth-child(3),.roadmap-table td:nth-child(3){width:78px}

/* Unit index */
.unit-index{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.unit-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;display:flex;gap:14px;align-items:flex-start;text-align:left;transition:.15s ease}
.unit-card:hover{border-color:#b8c3f2;box-shadow:0 8px 18px rgba(45,61,129,.08)}
.unit-num{flex:0 0 42px;width:42px;height:42px;border-radius:12px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:800;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.unit-card:nth-child(4n+2) .unit-num,.unit-card:nth-child(4n+4) .unit-num{background:var(--burgundy)}
.unit-card strong{display:block;line-height:1.28;margin-bottom:4px}
.unit-card small{color:var(--muted)}

/* Unit view */
.unit-toolbar{display:grid;grid-template-columns:auto minmax(240px,1fr) auto;gap:8px;align-items:center;margin-bottom:18px;padding:8px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16)}
.unit-nav-btn{background:rgba(255,248,241,.97);border:1px solid rgba(255,255,255,.44);padding:10px 13px}
.unit-select{width:100%;border:1px solid rgba(255,255,255,.44);background:rgba(255,248,241,.97);border-radius:10px;padding:10px 12px;font-weight:650}
.unit-title-wrap{margin-bottom:18px;color:#fff}
.unit-title-wrap h1{font-size:clamp(27px,3.6vw,42px);margin-bottom:9px}
.unit-badges{display:flex;gap:7px;flex-wrap:wrap}
.unit-badge{background:rgba(233,238,255,.96);border:1px solid rgba(255,255,255,.42);border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700;color:var(--royal-dark);box-shadow:0 3px 10px rgba(29,28,76,.08)}
.unit-badge:nth-child(2){background:rgba(249,226,235,.97);border-color:rgba(255,255,255,.42);color:var(--burgundy)}

.map-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}
.map-head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#dfe6ff 0%,#fff5ed 52%,#f5dce5 100%)}
.map-head strong{font-size:13px;color:var(--royal-dark)}
.map-actions{display:flex;gap:4px}
.map-stage{background:#e6e1ec;display:grid;place-items:center;min-height:280px;position:relative}
.map-stage img{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain;background:white}
.map-missing{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px}
.map-footer{padding:5px 12px;background:linear-gradient(90deg,rgba(43,69,184,.08),rgba(134,31,69,.08));border-top:1px solid #dfd4dc;text-align:center;color:#74666d;font-size:10.5px;line-height:1.35}
.map-stage:fullscreen{background:#111;padding:0;display:grid;grid-template-rows:1fr auto}
.map-stage:fullscreen img{width:100vw;height:calc(100vh - 30px);max-height:none;object-fit:contain}
.map-stage:fullscreen + .map-footer{display:none}
.fullscreen-wrap:fullscreen{background:#111;display:grid;grid-template-rows:1fr auto;width:100vw;height:100vh}
.fullscreen-wrap:fullscreen .map-stage{min-height:0;background:#111}
.fullscreen-wrap:fullscreen .map-stage img{width:100vw;height:calc(100vh - 30px);max-height:none;object-fit:contain}
.fullscreen-wrap:fullscreen .map-footer{background:rgba(20,20,20,.92);border-color:#333;color:#c9cecc;padding:7px 14px}

.content-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
.accordion-stack{display:grid;gap:9px}
details{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:750;display:flex;align-items:center;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;color:var(--muted);font-weight:400}
details[open] summary::after{content:"−"}
details[open] summary{border-bottom:1px solid var(--line)}
.detail-body{padding:15px 16px 17px}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
.field-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-bottom:4px}
.field-value{font-size:15px}
.scaffold-list{display:grid;gap:7px}
.scaffold{padding:10px 12px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:10px}

.side-actions{display:grid;gap:9px;position:sticky;top:88px}
.side-button{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;text-align:left;font-weight:700}
.side-button:hover{background:var(--accent-soft);border-color:#b8c3f2}
.side-button span{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:3px}

/* Color accents — structure and navigation unchanged */
.home-card:nth-child(4n+1){border-top:3px solid var(--accent)}
.home-card:nth-child(4n+2){border-top:3px solid var(--burgundy)}
.home-card:nth-child(4n+3){border-top:3px solid var(--gold)}
.home-card:nth-child(4n+4){border-top:3px solid var(--accent)}
summary{border-left:3px solid transparent}
details[open] summary{border-left-color:var(--accent);color:var(--royal-dark);background:#edf1ff}
.accordion-stack details:nth-child(even)[open] summary{border-left-color:var(--burgundy);color:var(--burgundy)}
.side-button:first-child{border-left:3px solid var(--accent)}
.side-button:nth-child(2){border-left:3px solid var(--burgundy)}
.filter-bar select:focus,.unit-select:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid rgba(65,105,225,.24);outline-offset:2px}

/* Tools */
.tool-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tool-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left}
.tool-card:hover{border-color:#b8c3f2;box-shadow:0 8px 18px rgba(45,61,129,.08)}
.tool-card small{display:block;color:var(--muted);margin-bottom:6px}
.tool-sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;overflow:auto}
.tool-sheet [contenteditable="true"]{min-height:54px;outline:none;background:#fffdf9}
.tool-sheet [contenteditable="true"]:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.prompt-row{margin:14px 0}
.prompt-row label{display:block;font-weight:750;margin-bottom:6px}
.prompt-row div{min-height:86px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fffdf9}

/* Notes drawer */
.drawer-backdrop{position:fixed;inset:0;background:rgba(24,31,67,.30);z-index:60;opacity:0;pointer-events:none;transition:.18s ease}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.notes-drawer{position:fixed;top:0;right:0;height:100vh;width:min(480px,94vw);background:var(--surface);z-index:70;box-shadow:-20px 0 50px rgba(35,42,92,.20);transform:translateX(102%);transition:.2s ease;display:grid;grid-template-rows:auto 1fr auto}
.notes-drawer.open{transform:none}
.drawer-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:start;gap:12px}
.drawer-head h2{font-size:20px;margin:0 0 3px}
.drawer-head p{font-size:12px;color:var(--muted);margin:0}
.close-btn{margin-left:auto;border:0;background:var(--accent-soft);color:var(--royal-dark);width:36px;height:36px;border-radius:10px;font-size:18px}
.drawer-body{padding:16px 18px;overflow:auto}
.notes-area{width:100%;height:100%;min-height:360px;resize:none;border:1px solid var(--line);border-radius:12px;padding:13px;outline:none;line-height:1.6;background:#fffaf6}
.notes-area:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.drawer-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;justify-content:flex-end;background:#f3edf5}
.action-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:700}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:white;box-shadow:0 4px 12px rgba(65,105,225,.20)}
.action-btn.danger{color:var(--burgundy)}

/* Search dialog */
.dialog-backdrop{position:fixed;inset:0;background:rgba(24,31,67,.32);z-index:80;display:grid;place-items:start center;padding:9vh 18px 18px}
.search-dialog{width:min(760px,100%);background:var(--surface);border-radius:16px;box-shadow:0 24px 70px rgba(32,39,83,.28);overflow:hidden}
.search-row{display:flex;gap:8px;padding:13px;border-bottom:1px solid var(--line)}
.search-input{flex:1;border:0;outline:none;font-size:17px;padding:8px}
.search-results{max-height:58vh;overflow:auto;padding:8px}
.search-result{display:block;width:100%;border:0;background:transparent;text-align:left;border-radius:10px;padding:11px 12px}
.search-result:hover{background:var(--accent-soft)}
.search-result strong{display:block;margin-bottom:3px}
.search-result small{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Notes-only print */
.notes-print-sheet{display:none}
@media print{
  body:not(.printing-notes){display:none!important}
  body.printing-notes > *{display:none!important}
  body.printing-notes .notes-print-sheet{display:block!important;color:#111;background:white;padding:18mm;font-family:Georgia,"Times New Roman",serif}
  .notes-print-sheet h1{font-size:20pt;margin:0 0 4mm}
  .notes-print-sheet h2{font-size:13pt;margin:0 0 8mm;font-weight:normal}
  .notes-print-sheet .print-notes-text{white-space:pre-wrap;font-size:11.5pt;line-height:1.6}
}

.mobile-menu{background:#fff8f1;color:var(--ink);border:0;border-radius:9px;padding:8px}
@media(max-width:900px){
  .main-nav{display:none}.mobile-menu{display:block}
  .home-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .content-layout{grid-template-columns:1fr}.side-actions{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}
  .unit-index,.tool-list{grid-template-columns:1fr}
}
@media(max-width:620px){
  .header-row{padding:10px 13px}.brand-sub{display:none}
  main{padding:22px 13px 58px}
  .home-actions{grid-template-columns:1fr}
  .unit-toolbar{grid-template-columns:44px minmax(0,1fr) 44px}
  .unit-nav-btn{font-size:0;padding:10px}.unit-nav-btn.prev::before{content:"←";font-size:18px}.unit-nav-btn.next::before{content:"→";font-size:18px}
  .side-actions{grid-template-columns:1fr}
  .page-head{align-items:start;flex-direction:column}
  th,td{padding:10px;font-size:12px}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-row">
    <a class="brand" href="#home" aria-label="Αρχική">
      <div class="brand-mark">Ι</div>
      <div class="brand-text">
        <div class="brand-title">Από την Ιστορική Γνώση στην Ιστορική Πράξη</div>
        <div class="brand-sub">Κάρτες εφαρμογής ανά ενότητα</div>
      </div>
    </a>
    <nav class="main-nav" aria-label="Κύρια πλοήγηση">
      <button class="nav-btn" data-route="roadmap">Οδικός χάρτης</button>
      <button class="nav-btn" data-route="units">Ενότητες</button>
      <button class="nav-btn" data-route="tools">Εκτυπώσιμα πρότυπα</button>
      <button class="nav-btn" data-route="rubric">Αποτίμηση</button>
      <button class="nav-btn" data-route="principle">Τελική αρχή</button>
    </nav>
    <button class="icon-btn" id="searchBtn" type="button" aria-label="Αναζήτηση">⌕ <span class="desktop-label">Αναζήτηση</span></button>
    <select class="mobile-menu" id="mobileMenu" aria-label="Κύρια πλοήγηση">
      <option value="home">Αρχική</option>
      <option value="roadmap">Οδικός χάρτης</option>
      <option value="units">Ενότητες</option>
      <option value="tools">Εκτυπώσιμα πρότυπα</option>
      <option value="rubric">Αποτίμηση</option>
      <option value="principle">Τελική αρχή</option>
    </select>
  </div>

  view.innerHTML=`<section class="view">
    <div class="unit-toolbar"><button class="unit-nav-btn prev" type="button" onclick="setHash('unit-${prev.id}')">← Προηγούμενη</button><select class="unit-select" id="unitSelect">${unitSelectOptions(u.id)}</select><button class="unit-nav-btn next" type="button" onclick="setHash('unit-${next.id}')">Επόμενη →</button></div>
    <div class="unit-title-wrap"><p class="kicker">ΕΝΟΤΗΤΑ ${u.id}</p><h1>${esc(u.title)}</h1><div class="unit-badges"><span class="unit-badge">${esc(u.reasoning)}</span><span class="unit-badge">${esc(u.tool)}</span><span class="unit-badge">${esc(sourcePeriods(u.periods))}</span></div></div>
    <figure class="map-card"><div class="map-head"><strong>Χάρτης</strong><div class="map-actions"><button class="plain-btn" id="fullscreenBtn" type="button">Πλήρης οθόνη</button></div></div><div class="fullscreen-wrap" id="fullscreenWrap"><div class="map-stage" id="mapStage"><img id="mapImg" src="${esc(u.image)}" alt="Χάρτης ενότητας ${u.id}"><div class="map-missing" id="mapMissing" hidden>Δεν βρέθηκε το αρχείο <strong>${esc(u.image)}</strong>.</div></div><figcaption class="map-footer">${esc(DATA.author)}</figcaption></div></figure>
    <div class="content-layout">
      <div class="accordion-stack">
        <details open><summary>Κόμβος, ερώτημα και ιστορικός συλλογισμός</summary><div class="detail-body">${detailField('Κόμβος εστίασης',u.node)}${detailField('Κεντρικό ερώτημα',u.question)}${detailField('Ιστορικός συλλογισμός',u.reasoning)}${detailField('Εργαλείο',u.tool)}</div></details>
        <details><summary>Βασικές έννοιες / στοιχεία και τεκμήριο</summary><div class="detail-body">${detailField('Βασικές έννοιες / στοιχεία',u.concepts)}${detailField('Προτεινόμενο τεκμήριο',u.evidence)}</div></details>
        <details><summary>Ροή εφαρμογής</summary><div class="detail-body">${flowBits.join('')}</div></details>
        <details><summary>Γλωσσικές σκαλωσιές και έλεγχος</summary><div class="detail-body">${scaffolds?`<div class="field"><div class="field-label">Γλωσσικές σκαλωσιές</div><div class="scaffold-list">${scaffolds}</div></div>`:''}${detailField('Επιστροφή στον Χάρτη',u.return_map)}${detailField('Δελτίο εξόδου',u.exit_ticket)}</div></details>
      </div>
      <aside class="side-actions"><button class="side-button" id="notesBtn" type="button">Προσωπικές σημειώσεις<span>Αποθήκευση σε αυτόν τον browser</span></button><button class="side-button" type="button" onclick="setHash('tools')">Εκτυπώσιμα πρότυπα<span>${esc(u.tool)}</span></button></aside>
    </div>
  </section>`;
  document.getElementById('unitSelect').onchange=e=>setHash('unit-'+e.target.value);
  const img=document.getElementById('mapImg'), miss=document.getElementById('mapMissing');
  img.addEventListener('error',()=>{img.hidden=true;miss.hidden=false});
  document.getElementById('fullscreenBtn').onclick=async()=>{const el=document.getElementById('fullscreenWrap'); if(!document.fullscreenElement) await el.requestFullscreen?.(); else await document.exitFullscreen?.()};
  document.getElementById('notesBtn').onclick=()=>openNotes(u);
}
function renderTools(){
  navActive('tools');
  view.innerHTML=`<section class="view"><div class="page-head"><div><p class="kicker">ΥΛΙΚΟ ΑΝΑΦΟΡΑΣ</p><h1>Γενικά εκτυπώσιμα πρότυπα</h1><p>${esc(INTRO.toolsIntro)}</p></div></div><div class="tool-list">${DATA.tools.map(t=>`<button class="tool-card" onclick="setHash('tool-${t.id}')"><small>Πρότυπο ${t.id}</small><strong>${esc(t.title)}</strong></button>`).join('')}</div></section>`;
}
function renderTool(id){
  navActive('tools'); const t=DATA.tools.find(x=>x.id===Number(id));if(!t){renderTools();return}
  let body='';
  if(t.kind==='table') body=`<div class="table-wrap"><table><thead><tr>${t.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${Array.from({length:t.rows},()=>`<tr>${t.headers.map(()=>`<td contenteditable="true"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  else body=t.prompts.map(p=>`<div class="prompt-row"><label>${esc(p)}</label><div contenteditable="true"></div></div>`).join('');
  view.innerHTML=`<section class="view"><div class="page-head"><div><p class="kicker">ΕΚΤΥΠΩΣΙΜΑ ΠΡΟΤΥΠΑ</p><h1>Πρότυπο ${t.id} — ${esc(t.title)}</h1><p>Επεξεργάσιμο πρότυπο</p></div><div class="page-head-actions"><button class="plain-btn" onclick="setHash('tools')">← Όλα τα πρότυπα</button></div></div><div class="tool-sheet">${body}</div></section>`;
}
function renderRubric(){
  navActive('rubric'); const [head,...rows]=DATA.rubric;
  view.innerHTML=`<section class="view"><div class="page-head"><div><p class="kicker">ΑΠΟΤΙΜΗΣΗ</p><h1>Σύντομη ρουμπρίκα ιστορικού λόγου</h1><p>${esc(INTRO.rubricSubtitle)}</p></div></div><div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
}
function renderPrinciple(){
  navActive('principle');
  view.innerHTML=`<section class="view"><div class="page-head"><div><p class="kicker">ΤΕΛΙΚΗ ΑΡΧΗ</p><h1>Η τελική αρχή εφαρμογής</h1><p class="source-copy">${esc(INTRO.principleLead)}</p></div></div><div class="accordion-stack">${INTRO.principleSteps.map((s,i)=>`<div class="tool-card"><small>${i+1}</small><strong>${esc(s)}</strong></div>`).join('')}<div class="source-flow">${esc(INTRO.principleEnd)}</div></div></section>`;
}
function route(){
  const raw=location.hash.replace(/^#/,'')||'home';
  if(raw==='home')renderHome(); else if(raw==='roadmap')renderRoadmap(); else if(raw==='units')renderUnits(); else if(raw==='tools')renderTools(); else if(raw==='rubric')renderRubric(); else if(raw==='principle')renderPrinciple(); else if(raw.startsWith('unit-'))renderUnit(raw.split('-')[1]); else if(raw.startsWith('tool-'))renderTool(raw.split('-')[1]); else renderHome();
  window.scrollTo({top:0,behavior:'instant'});
}

/* Main nav */
document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>setHash(b.dataset.route));
document.getElementById('mobileMenu').onchange=e=>setHash(e.target.value);
window.addEventListener('hashchange',route);

/* Search */
const searchDialog=document.getElementById('searchDialog'), searchInput=document.getElementById('searchInput'), searchResults=document.getElementById('searchResults');
function openSearch(){searchDialog.hidden=false;searchInput.value='';drawSearch('');setTimeout(()=>searchInput.focus(),10)}
function closeSearch(){searchDialog.hidden=true}
function searchable(u){return [u.id,u.title,u.node,u.reasoning,u.tool,u.question,u.concepts,u.evidence,u.period1,u.period2,u.application,...(u.scaffolds||[]),u.return_map,u.exit_ticket].join(' ').toLocaleLowerCase('el')}
function drawSearch(q){q=q.trim().toLocaleLowerCase('el'); if(!q){searchResults.innerHTML='<div class="empty">Γράψτε λέξη ή φράση.</div>';return} const hits=DATA.units.filter(u=>searchable(u).includes(q));searchResults.innerHTML=hits.length?hits.map(u=>`<button class="search-result" data-id="${u.id}"><strong>Ενότητα ${u.id} — ${esc(u.title)}</strong><small>${esc(u.reasoning)} · ${esc(u.tool)}</small></button>`).join(''):'<div class="empty">Δεν βρέθηκαν αποτελέσματα.</div>';searchResults.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{closeSearch();setHash('unit-'+b.dataset.id)})}
document.getElementById('searchBtn').onclick=openSearch;document.getElementById('closeSearch').onclick=closeSearch;searchInput.oninput=e=>drawSearch(e.target.value);searchDialog.addEventListener('click',e=>{if(e.target===searchDialog)closeSearch()});

/* Notes */
const drawer=document.getElementById('notesDrawer'), backdrop=document.getElementById('drawerBackdrop'), notesArea=document.getElementById('notesArea'); let noteUnit=null;
function noteKey(id){return 'history-reference-notes-unit-'+id}
function openNotes(u){noteUnit=u;document.getElementById('notesUnitLabel').textContent=`Ενότητα ${u.id} — ${u.title}`;notesArea.value=localStorage.getItem(noteKey(u.id))||'';drawer.classList.add('open');backdrop.classList.add('open');drawer.setAttribute('aria-hidden','false');setTimeout(()=>notesArea.focus(),120)}
function closeNotes(){drawer.classList.remove('open');backdrop.classList.remove('open');drawer.setAttribute('aria-hidden','true')}
notesArea.addEventListener('input',()=>{if(noteUnit)localStorage.setItem(noteKey(noteUnit.id),notesArea.value)});
document.getElementById('closeNotes').onclick=closeNotes;backdrop.onclick=closeNotes;
document.getElementById('clearNotes').onclick=()=>{if(!noteUnit)return;if(confirm('Να διαγραφούν οι προσωπικές σημειώσεις αυτής της ενότητας;')){notesArea.value='';localStorage.removeItem(noteKey(noteUnit.id))}};
document.getElementById('printNotes').onclick=()=>{if(!noteUnit)return;document.getElementById('printUnitTitle').textContent=`Ενότητα ${noteUnit.id} — ${noteUnit.title}`;document.getElementById('printNotesText').textContent=notesArea.value||'';document.body.classList.add('printing-notes');window.print();setTimeout(()=>document.body.classList.remove('printing-notes'),300)};
window.addEventListener('afterprint',()=>document.body.classList.remove('printing-notes'));

/* Keyboard */
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!searchDialog.hidden)closeSearch();if(drawer.classList.contains('open'))closeNotes();return} const tag=document.activeElement?.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||document.activeElement?.isContentEditable)return; const raw=location.hash.replace(/^#/,'');if(raw.startsWith('unit-')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const id=Number(raw.split('-')[1]),idx=DATA.units.findIndex(u=>u.id===id);if(idx>=0){const n=e.key==='ArrowRight'?DATA.units[(idx+1)%DATA.units.length]:DATA.units[(idx-1+DATA.units.length)%DATA.units.length];setHash('unit-'+n.id)}}});
route();
</script>
</body>
</html>
